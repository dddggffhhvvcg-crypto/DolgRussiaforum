<!DOCTYPE html>
<script>window.DB_ID='';/* ВСТАВЬ ID БАЗЫ МЕЖДУ КАВЫЧКАМИ */</script>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DolgRassia | Форум</title>
<style>
:root{--bg:#e9ecf0;--row:#fff;--row2:#f4f6f8;--hd:#dfe3e8;--tx:#1c2026;--mu:#5d6672;--ln:#d3d8de;--ac:#c62818;--ok:#2e8b3d;--top:#22262c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b2f36;--row:#363a43;--row2:#3e434c;--hd:#464b55;--tx:#ecedef;--mu:#a9aeb7;--ln:#2a2d34;--ac:#d9301f;--ok:#3aa14b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2b2f36;--row:#363a43;--row2:#3e434c;--hd:#464b55;--tx:#ecedef;--mu:#a9aeb7;--ln:#2a2d34;--ac:#d9301f;--ok:#3aa14b;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 Roboto,system-ui,"Segoe UI",Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--top)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;display:flex;align-items:center;gap:6px;height:56px;padding:0 8px;background:var(--top);color:#eee;border-bottom:1px solid #0007}
.ib{display:grid;place-items:center;width:44px;height:44px;border:0;background:none;color:inherit;border-radius:8px}
.hi{width:26px;height:26px}
.br{flex:1;display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:700;font-size:19px}
.lg{display:grid;place-items:center;width:34px;height:34px;border-radius:6px;background:#8a8f98;color:#22262c;font-weight:800}
main{max-width:760px;margin:0 auto;padding-bottom:28px}
h1{margin:0;padding:26px 16px 14px;font-size:30px;font-weight:400}
.bk{display:block;padding:6px 16px 18px;color:var(--tx);text-decoration:none;font-size:18px}
.bx{margin:0 0 22px;background:var(--row)}
.hd{display:flex;justify-content:space-between;align-items:center;margin:0;padding:16px;background:var(--hd);font-size:19px;font-weight:500;cursor:pointer}
.hd::after{content:"";width:11px;height:11px;margin-top:6px;border:solid currentColor;border-width:3px 0 0 3px;transform:rotate(45deg);transition:transform .2s}
.cl .hd::after{margin-top:-4px;transform:rotate(225deg)}
.cl>:not(.hd){display:none}
.nd{display:flex;gap:14px;align-items:flex-start;width:100%;padding:16px;border:0;border-top:1px solid var(--ln);background:var(--row);color:inherit;font:inherit;text-align:left;text-decoration:none;cursor:pointer}
.nd:nth-child(2n){background:var(--row2)}
.nd>span{flex:1;min-width:0}
.nd b{display:block;font-size:19px;font-weight:500}
.st,.lp{display:block;margin-top:4px;color:var(--mu)}
.st em{margin-left:12px;font-style:normal}
.ic{width:34px;height:34px;flex:none}
.r{color:var(--ac)}.g{color:var(--mu)}
.em{margin:0;padding:22px 16px;color:var(--mu)}
.ac{padding:0 16px 16px}
.bt{padding:12px 20px;border:0;border-radius:6px;background:var(--ac);color:#fff;font:inherit;font-weight:500;cursor:pointer}
form{display:grid;gap:12px;padding:0 16px 20px}
input,textarea{width:100%;padding:12px;border:1px solid var(--ln);border-radius:6px;background:var(--row2);color:var(--tx);font:inherit}
.fm label{display:grid;gap:8px;font-size:18px}
.fm small{color:var(--mu);font-size:14px}
.pw{display:flex}
.pw input{border-radius:6px 0 0 6px}
.pw button{padding:0 14px;border:1px solid var(--ln);border-left:0;border-radius:0 6px 6px 0;background:var(--row2);color:var(--tx);font:inherit}
.fm .ck{display:flex;align-items:center;gap:10px;font-size:16px}
.ck input{width:20px;height:20px}
.tp{display:flex;gap:12px;padding:14px 16px;border-top:1px solid var(--ln)}
.tp>span:last-child{min-width:0;flex:1}
.av{display:grid;place-items:center;flex:none;width:40px;height:40px;border-radius:50%;background:var(--hd);font-weight:700}
.tp b{display:block;font-size:18px}
.mu{display:block;color:var(--mu);font-size:14px}
.bd{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px;white-space:pre-line;cursor:pointer}
.bd.o{display:block;-webkit-line-clamp:unset}
.sb{display:inline-block;margin-top:6px;padding:2px 10px;border-radius:10px;background:#8a8f98;color:#fff;font-size:13px}
.sb.ok{background:var(--ok)}.sb.no{background:var(--ac)}
.ans{margin-top:6px;padding:8px 10px;border-left:3px solid var(--ac);background:var(--row2);white-space:pre-line}
.ctl{display:grid;gap:8px;margin-top:10px}
.ctl .row{display:flex;gap:8px;flex-wrap:wrap}
.ctl .bt{padding:9px 14px;font-size:15px}
.ctl .bt.ok{background:var(--ok)}
.dl{padding:9px 14px;border:1px solid var(--ln);border-radius:6px;background:none;color:var(--ac);font:inherit;font-size:15px;cursor:pointer}
.stt{display:flex;flex-wrap:wrap;gap:10px;padding:16px}
.stt div{flex:1 1 130px;padding:12px;border-radius:6px;background:var(--row2);font-size:14px;color:var(--mu)}
.stt b{display:block;font-size:26px;color:var(--tx)}
footer{padding:0 16px 24px;color:var(--mu);font-size:14px;text-align:center}
#dr{position:fixed;inset:0;z-index:20;display:none}
#dr.on{display:block}
.ov{position:absolute;inset:0;background:#0008}
#dr nav{position:absolute;top:0;bottom:0;left:0;width:78%;max-width:320px;padding-top:env(safe-area-inset-top,0px);overflow:auto;background:var(--row)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:12px 12px 12px 24px;background:var(--hd);font-size:19px;font-weight:500}
.mh button{width:40px;height:40px;border:0;background:none;color:inherit;font-size:28px}
.mi{display:block;width:100%;padding:18px 24px;border:0;border-bottom:1px solid var(--ln);background:none;color:var(--tx);font:inherit;font-size:19px;text-align:left;text-decoration:none}
.mi.s{padding:14px 24px 14px 44px;color:var(--mu);font-size:16px}
#ts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:30;padding:10px 18px;border-radius:8px;background:#111;color:#fff;opacity:0;pointer-events:none;transform:translateX(-50%);transition:opacity .2s}
#ts.on{opacity:1}
.em a{color:var(--ac)}
.msg{margin:0;color:var(--ac);font-size:15px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.ru{padding:16px;border-top:1px solid var(--ln)}.ru:nth-child(2n){background:var(--row2)}.ru b{display:block;font-size:18px}.ru p{margin:6px 0 0}.ru .pn{color:var(--ac)}.ru a{color:var(--ac)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="bub" viewBox="0 0 34 34"><path d="M5 4h24a3 3 0 0 1 3 3v14a3 3 0 0 1-3 3H17l-7 6v-6H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M9 11h16M9 17h10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
<symbol id="lnk" viewBox="0 0 34 34"><g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 20l6-6"/><path d="M13 12l3-3a5 5 0 0 1 7 7l-3 3"/><path d="M21 22l-3 3a5 5 0 0 1-7-7l3-3"/></g></symbol>
<symbol id="key" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="15.5" cy="8.5" r="5"/><path d="M12 12L3 21h4v-3h3v-3"/></g></symbol>

<header>
<button class="ib" id="mn" aria-label="Меню"><svg class="hi"><use href="#mnu"/></svg></button>
<a class="br" href="#home"><span class="lg">D</span>DolgRassia</a>
<a class="ib" id="acc" href="#login" aria-label="Вход/Регистрация"><svg class="hi"><use href="#key"/></svg></a>
</header>
<div id="dr">
<div class="ov" data-x></div>
<nav>
<div class="mh">Меню<button data-x aria-label="Закрыть">×</button></div>
<a class="mi" href="#home">Главная</a>
<a class="mi" href="#home">Форумы</a>

</nav>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
const $=s=>document.querySelector(s),A=$('#app'),D=$('#dr'),T=$('#ts');
const E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const F=[
['player','Жалобы на игроков',"Ваш ник:\nНик игрока:\nДата и время нарушения:\nСуть жалобы:\nДоказательства (ссылка):\n",'cmp'],
['admin','Жалобы на администрацию',"Ваш ник:\nНик администратора:\nДата и время:\nСуть жалобы:\nДоказательства (ссылка):\n",'cmp'],
['leader','Жалобы на лидеров',"Ваш ник:\nНик лидера и организация:\nДата и время:\nСуть жалобы:\nДоказательства (ссылка):\n",'cmp'],
['appeal','Обжалование наказаний',"Ваш ник:\nКакое наказание и кем выдано:\nДата выдачи:\nПочему наказание неверное:\nДоказательства (ссылка):\n",'cmp'],
['lead','Заявки на лидера организации',"Ваш ник:\nВозраст:\nНа какую организацию подаёте заявку:\nОпыт лидерства:\nОнлайн в день:\nПочему именно вы:\n",'app'],
['adm','Заявки на администратора',"Ваш ник:\nВозраст:\nОпыт администрирования:\nОнлайн в день:\nЧасовой пояс:\nПочему хотите в администрацию:\n",'app']];
const S={news:'Новости и информация',tech:'Технический раздел',ideas:'Предложения по улучшению',rules:'Правила серверов'};
const RU=[['1. ДМ (DeathMatch)','Нельзя убивать игроков без причины, вне ролевой ситуации.','Убивайте только по причине: перестрелка, захват, война организаций.','Предупреждение или тюрьма 30–60 минут, при повторе — бан.'],
['2. Неуважение к игроку','Нельзя оскорблять, унижать, провоцировать и травить других игроков.','Общайтесь вежливо, споры решайте спокойно или через жалобу.','Мут 30–120 минут, при повторе — бан.'],
['3. Оскорбление родных','Нельзя упоминать и оскорблять родных и близких игрока.','Не затрагивайте семью ни в чате, ни в голосовом общении.','Бан на срок до 30 дней, при повторе — навсегда.'],
['4. Оскорбление администратора','Нельзя оскорблять, оговаривать и провоцировать администрацию.','Если не согласны с решением админа, подайте жалобу в разделе «Жалобы на администрацию» или обжалуйте наказание.','Мут или бан от 1 до 30 дней.'],
['5. Cheat (читы)','Запрещены читы, сторонний софт, макросы и любые программы, дающие преимущество.','Играйте только с чистым клиентом, без стороннего ПО.','Бан навсегда.'],
['6. Сборки','Запрещены сборки с изменением игровых файлов, модами и текстурами, дающими преимущество (например, подсветка игроков, ускорение, удаление объектов).','Используйте чистый клиент или только сборки, разрешённые администрацией.','Бан до удаления сборки, при повторе — навсегда.']];
const RULES=RU.map(r=>`<div class="ru"><b>${r[0]}</b><p><b style="display:inline;font-size:16px">Нельзя:</b> ${r[1]}</p><p><b style="display:inline;font-size:16px">Надо:</b> ${r[2]}</p><p class="pn"><b style="display:inline;font-size:16px">Наказание:</b> ${r[3]}</p></div>`).join('')+'<p class="em">Нашли нарушителя? Подайте <a href="#player">жалобу на игрока</a> с доказательствами (видео или скриншот). Не согласны с наказанием — <a href="#appeal">обжалуйте его</a>.</p>';
const FRL=[['Общее','Нельзя оскорблять, флудить, писать бессмысленные темы и рекламировать другие проекты.','Общайтесь уважительно и пишите только по делу.'],
['Заголовок и шаблон','Нельзя удалять шаблон или оставлять поля пустыми.','Называйте тему «Nick_Name | Суть» и заполняйте все пункты шаблона.'],
['Жалобы и обжалования','Нельзя подавать жалобу без доказательств, ложную жалобу и дублировать одну и ту же тему.','Прикладывайте ссылку на видео или скриншот с датой и временем. Одна жалоба — одна тема, ожидайте ответа администрации.'],
['Заявки на лидера и админа','Нельзя указывать ложные данные, подавать несколько заявок подряд и торопить администрацию.','Честно заполните анкету и дождитесь решения: «Принято» или «Отказано».'],
['Решения администрации','Нельзя спорить с решением в теме или оскорблять проверяющего.','Если не согласны, подайте жалобу на администрацию или обжалование.']];
const FRULES=FRL.map(r=>`<div class="ru"><b>${r[0]}</b><p><b style="display:inline;font-size:16px">Нельзя:</b> ${r[1]}</p><p><b style="display:inline;font-size:16px">Надо:</b> ${r[2]}</p></div>`).join('')+'<p class="em">Нарушение правил форума: удаление темы администратором, при повторе — блокировка.</p>';
const FK=F.map(x=>x[0]),mem={};
let CU=null;
function ld(k){return mem[k]||[]}
function refresh(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA/.test(a.tagName))return;const y=scrollY;go();scrollTo(0,y)}
const tot=()=>F.reduce((s,x)=>s+ld(x[0]).length,0);
const pend=()=>F.reduce((s,x)=>s+ld(x[0]).filter(t=>!t.s).length,0);
const bub=(h,t,n)=>`<a class="nd" href="#${h}"><svg class="ic r"><use href="#bub"/></svg><span><b>${t}</b><span class="st">Темы ${n}<em>Сообщения ${n}</em></span>${n?'':'<span class="lp">Нет</span>'}</span></a>`;
const lnk=(t,href)=>href=='#'?`<button class="nd" data-na><svg class="ic g"><use href="#lnk"/></svg><span><b>${t}</b></span></button>`:`<a class="nd" href="${href}" target="_blank" rel="noopener noreferrer"><svg class="ic g"><use href="#lnk"/></svg><span><b>${t}</b></span></a>`;
const box=(t,c)=>`<section class="bx">${t?`<h2 class="hd" tabindex="0" role="button">${t}</h2>`:''}${c}</section>`;
const ttl=(t,b,h)=>`<h1>${t}</h1>${b?`<a class="bk" href="#${h}">‹ ${b}</a>`:''}`;

// --- база: ID блока с jsonblob.com (инструкция в ответе) ---
const BLOB=window.DB_ID||'';
const API='https://jsonblob.com/api/jsonBlob/';
const AE='dolgrussia@gmail.com',AH='097b6d947cd0917d98509d2b9339398db60c9e88b966f4b2b9809f56ac9af684';
const HD={'Content-Type':'application/json',Accept:'application/json'};
const sha=async x=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(x)))].map(c=>c.toString(16).padStart(2,'0')).join('');
async function rd(){const r=await fetch(API+BLOB,{headers:HD,cache:'no-store'});if(!r.ok)throw 0;const d=await r.json();return Array.isArray(d.topics)?d.topics:[]}
async function wr(t){const r=await fetch(API+BLOB,{method:'PUT',headers:HD,body:JSON.stringify({topics:t})});if(!r.ok)throw 0}
function put(t){const m={};t.sort((a,b)=>b.ts-a.ts).forEach(x=>{(m[x.k]=m[x.k]||[]).push(x)});Object.keys(mem).forEach(k=>delete mem[k]);Object.assign(mem,m)}
async function pull(){if(!BLOB)return;try{put(await rd());refresh()}catch(e){}}
async function mut(fn){const n=fn(await rd());await wr(n);put(n);refresh()}
function currentUser(){return CU}
function isAdmin(){return !!CU&&CU.email===AE&&CU.verified}
try{if(localStorage.getItem('dr:adm')=='1')CU={name:'Админ',email:AE,verified:true}}catch(e){}
pull();setInterval(pull,15000);addEventListener('focus',pull);

let R=(location.hash||'#home').slice(1)||'home';
const nav=h=>{R=h;try{if(location.hash!='#'+h)location.hash='#'+h}catch(e){}go()};

function home(){
 const n=tot();
 return ttl('Форум DolgRassia')+(BLOB?'':'<div class="ac"><p class="msg">База не подключена.</p><button class="bt" data-mk>Создать базу</button></div>')
  +box('Основной раздел',bub('news',S.news,ld('news').length)+bub('tech',S.tech,ld('tech').length)+bub('ideas',S.ideas,ld('ideas').length)
   +['Официальное сообщество в Discord','Официальное сообщество ВКонтакте','Лаборатория разработки (ВКонтакте)'].map(t=>lnk(t,'#')).join('')
   +lnk('Официальный Telegram-канал','https://t.me/DolgRussia'))
  +box('Игровые сервера',bub('rules',S.rules,ld('rules').length)+bub('srv','Сервер DolgRussia',n));
}
const fname=k=>(F.find(x=>x[0]==k)||[])[1]||'';
const SL={ok:'Принято',no:'Отказано'};
const ctl=(k,i)=>`<span class="ctl"><input class="an" maxlength="300" placeholder="Комментарий (необязательно)"><span class="row"><button class="bt ok" data-st="${i}:ok">Принято</button><button class="bt" data-st="${i}:no">Отказано</button><button class="dl" data-del="${i}">Удалить</button></span></span>`;
const tpc=(x,k,_,d,tag,i=x.id)=>`<div class="tp"><span class="av">${E((x.t[0]||'?').toUpperCase())}</span><span><b>${E(x.t)}</b><span class="mu">${tag?E(fname(k))+' · ':''}${E(x.author||d)} · ${E(x.d)}</span><span class="bd">${E(x.b)}</span>${FK.includes(k)?`<span class="sb ${x.s||''}">${SL[x.s]||'На рассмотрении'}</span>`:''}${x.s&&x.a?`<span class="ans"><b style="font-size:14px">Ответ${x.by?' · '+E(x.by):''}:</b>${E(x.a)}</span>`:''}${isAdmin()?(FK.includes(k)?ctl(k,i):`<span class="ctl"><span class="row"><button class="dl" data-del="${i}">Удалить</button></span></span>`):''}</span></div>`;
const lst=(k,d,e)=>ld(k).length?ld(k).map((x,i)=>tpc(x,k,i,d)).join(''):`<p class="em">${e}</p>`;
function forum(f){
 const p=f[3]=='app'?['Заявки','app']:['Жалобы','cmp'];
 return [f[1],ttl(f[1],p[0],p[1])
  +`<div class="ac"><button class="bt" id="nw">${f[3]=='app'?'Подать заявку':'Создать тему'}</button></div>`
  +`<form id="nf" data-k="${f[0]}" hidden><input name="t" required maxlength="120" placeholder="${f[3]=='app'?'Nick_Name | Заявка':'Nick_Name | Суть жалобы'}"><textarea name="b" required rows="9">${f[2]}</textarea><span class="mu">Тема будет видна администрации. Вход не нужен.</span><button class="bt">Опубликовать</button></form>`
  +box('Обычные темы',lst(f[0],'Гость','Тем пока нет. Создайте первую.'))];
}
function reg(){
 return ttl('Регистрация')+`<form id="rf" class="fm"><label>Имя пользователя <small>Обязательно</small><input name="username" required maxlength="30" autocomplete="username"></label><span class="mu">Это имя будет отображаться в ваших сообщениях.</span><label>Электронная почта <small>Обязательно</small><input name="email" type="email" required autocomplete="email"></label><label>Пароль <small>Обязательно</small><span class="pw"><input id="pw" name="password" type="password" required minlength="6" autocomplete="new-password"><button type="button" data-ps>Показать</button></span></label><label class="ck"><input type="checkbox" required>Я согласен(на) с условиями и политикой конфиденциальности</label><button class="bt">Зарегистрироваться</button></form><p class="em">Уже есть аккаунт? <a href="#login">Войти</a></p>`;
}
function login(){
 return ttl('Вход')+`<form id="lf" class="fm"><label>Электронная почта<input name="email" type="email" required autocomplete="username"></label><label>Пароль<span class="pw"><input id="pw" name="password" type="password" required autocomplete="current-password"><button type="button" data-ps>Показать</button></span></label><button class="bt">Войти</button></form>`;
}
function admin(){
 if(!isAdmin())return['Доступ запрещён',ttl('Доступ запрещён','Главная','home')+box('','<p class="em">У вас нет прав для просмотра этой страницы.</p>')];
 const q=[];F.forEach(f=>ld(f[0]).forEach((x,i)=>{if(!x.s)q.push(tpc(x,f[0],i,'Гость',1))}));
 const c=k=>ld(k).filter(x=>x.s=='ok').length;
 const stat=`<div class="stt"><div><b>${pend()}</b>на рассмотрении</div><div><b>${ld('lead').length}</b>заявок на лидера</div><div><b>${ld('adm').length}</b>заявок в админы</div><div><b>${F.reduce((s,f)=>s+c(f[0]),0)}</b>принято</div></div>`;
 return['Админ панель',ttl('Админ панель','Главная','home')
  +box('Статистика',stat)
  +box('Ожидают решения ('+q.length+')',q.length?q.join(''):'<p class="em">Всё рассмотрено.</p>')
  +box('Все заявки и жалобы',F.map(f=>bub(f[0],f[1],ld(f[0]).length)).join(''))
  +['news','tech','ideas','rules'].map(k=>box('Публикация: '+S[k],`<form class="afm" data-k="${k}"><input name="t" required maxlength="120" placeholder="Заголовок"><textarea name="b" required rows="5" placeholder="Текст"></textarea><button class="bt">Добавить</button></form>`+lst(k,'Админ','Пока пусто.'))).join('')];
}
function view(h){
 const f=F.find(x=>x[0]==h);
 if(h=='srv')return['Сервер DolgRussia',ttl('Сервер DolgRussia','Игровые сервера','home')+box('',bub('cmp','Жалобы',F.slice(0,4).reduce((s,x)=>s+ld(x[0]).length,0))+bub('app','Заявки (лидер / админ)',ld('lead').length+ld('adm').length))];
 if(h=='cmp')return['Жалобы',ttl('Жалобы','Сервер DolgRussia','srv')+box('',F.slice(0,4).map(x=>bub(x[0],x[1],ld(x[0]).length)).join(''))];
 if(h=='app')return['Заявки',ttl('Заявки','Сервер DolgRussia','srv')+box('',F.slice(4).map(x=>bub(x[0],x[1],ld(x[0]).length)).join(''))];
 if(f)return forum(f);
 if(S.hasOwnProperty(h))return[S[h],ttl(S[h],'Форумы','home')+(h=='rules'?box('Правила форума',FRULES)+box('Правила сервера',RULES):'')+box(h=='rules'?'Дополнения':'',lst(h,'Гость','Тем пока нет.'))];
 if(h=='reg')return['Регистрация',reg()];
 if(h=='login')return['Вход',login()];
 if(h=='panel')return admin();
 return['Форум',home()];
}
function go(){
 const h=R,r=view(h),u=currentUser();
 A.innerHTML=r[1];document.title=r[0]+' | DolgRassia';scrollTo(0,0);
 $('#adminMenu').hidden=!isAdmin();$('#logoutMenu').hidden=!u;$('#loginMenu').hidden=!!u;$('#acc').hidden=!!u;
 const w=$('#who');w.hidden=!u;if(u)w.textContent='Вы вошли как '+u.name;
}
let tm;
function toast(m){T.textContent=m;T.classList.add('on');clearTimeout(tm);tm=setTimeout(()=>T.classList.remove('on'),1800)}
document.addEventListener('click',e=>{
 const t=e.target;
 const sb=t.closest('form button:not([type=button])');
 if(sb){e.preventDefault();sub(sb.closest('form'));return}
 const ln=t.closest('a[href^="#"]');
 if(ln&&ln.getAttribute('href').length>1){e.preventDefault();D.classList.remove('on');nav(ln.getAttribute('href').slice(1));return}
 if(t.closest('[data-na]')){e.preventDefault();toast('Недоступно')}
 if(t.closest('#mn'))D.classList.add('on');
 if(t.closest('[data-x]')||t.closest('#dr a'))D.classList.remove('on');
 if(t.closest('#nw')){const f=$('#nf');f.hidden=!f.hidden}
 const p=t.closest('[data-ps]');
 if(p){const i=$('#pw');i.type=i.type=='password'?'text':'password';p.textContent=i.type=='password'?'Показать':'Скрыть'}
 const dl=t.closest('[data-del]');
 if(dl&&isAdmin()){const id=dl.dataset.del;mut(a=>a.filter(x=>x.id!==id)).then(()=>toast('Удалено')).catch(()=>toast('Ошибка связи с базой'));return}
 const st=t.closest('[data-st]');
 if(st&&isAdmin()){const[id,s]=st.dataset.st.split(':'),cm=(st.closest('.ctl').querySelector('.an').value||'').trim();mut(a=>a.map(x=>x.id==id?{...x,s,a:cm,by:'Админ'}:x)).then(()=>toast(SL[s])).catch(()=>toast('Ошибка связи с базой'));return}
 const mk=t.closest('[data-mk]');
 if(mk){fetch(API,{method:'POST',headers:HD,body:'{"topics":[]}'}).then(r=>{const id=(r.headers.get('Location')||'').split('/').pop();mk.parentNode.innerHTML=id?`<p class="em">ID базы: <b>${E(id)}</b><br>Вставьте его во 2-ю строку файла между кавычками и сохраните файл на GitHub.</p>`:'<p class="em">ID получить не удалось. Создайте базу вручную на jsonblob.com.</p>'}).catch(()=>toast('Нет связи с jsonblob'));return}
 const bd=t.closest('.bd');
 if(bd)bd.classList.toggle('o');
 const h=t.closest('.hd');
 if(h)h.parentNode.classList.toggle('cl');
});
document.addEventListener('keydown',e=>{
 if(e.key=='Escape')D.classList.remove('on');
 if((e.key=='Enter'||e.key==' ')&&e.target.classList&&e.target.classList.contains('hd')){e.preventDefault();e.target.parentNode.classList.toggle('cl')}
});
function msg(f,m){let p=f.querySelector('.msg');if(!p){p=document.createElement('p');p.className='msg';p.setAttribute('role','alert');f.insertBefore(p,f.querySelector('button.bt'))}p.textContent=m;toast(m)}
function bad(f){for(const el of f.elements){
 if(el.type=='checkbox'){if(el.required&&!el.checked)return'Подтвердите согласие с условиями';continue}
 if(el.tagName=='BUTTON')continue;
 const v=el.value.trim();
 if(el.required&&!v)return'Заполните все поля';
 if(el.type=='email'&&!/^\S+@\S+\.\S+$/.test(v))return'Введите корректную почту';
 if(el.type=='password'&&el.minLength>0&&el.value.length<el.minLength)return'Пароль: минимум '+el.minLength+' символов'}
 return''}
let busy=false;
function sub(f){
 if(busy)return;
 const er=bad(f);if(er){msg(f,er);return}
 if(f.id=='lf'){
  const d=new FormData(f),email=d.get('email').trim().toLowerCase();busy=true;
  sha(d.get('password')).then(h=>{if(email===AE&&h===AH){CU={name:'Админ',email:AE,verified:true};try{localStorage.setItem('dr:adm','1')}catch(e){}toast('Вход выполнен');nav('home')}else msg(f,'Неверная почта или пароль')}).finally(()=>busy=false);return}
 const k=f.dataset.k,adm=f.classList.contains('afm');
 if(!k||(adm&&!isAdmin()))return;
 if(!BLOB){msg(f,'База не подключена');return}
 const el=f.elements,t=el.t.value.trim(),b=el.b.value.trim(),m=b.match(/Ваш ник:[ \t]*([^\n]+)/);
 const x={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),k,t,b,d:new Date().toLocaleDateString('ru-RU'),author:adm?'Админ':((m&&m[1].trim().slice(0,40))||'Гость'),ts:Date.now()};
 busy=true;
 mut(a=>[x,...a]).then(()=>toast(adm?'Добавлено':'Тема отправлена')).catch(()=>msg(f,'Не удалось отправить')).finally(()=>busy=false);
}
document.addEventListener('submit',e=>{e.preventDefault();sub(e.target)});
$('#adminMenu').addEventListener('click',()=>{D.classList.remove('on');nav('panel')});
$('#logoutMenu').addEventListener('click',()=>{CU=null;try{localStorage.removeItem('dr:adm')}catch(e){}D.classList.remove('on');toast('Вы вышли');nav('home')});
addEventListener('hashchange',()=>{const h=(location.hash||'#home').slice(1)||'home';if(h!=R){R=h;go()}});
go();
});
</script>
</body>
